services:
  - type: worker
    name: the-serene-bot
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot-telegram/bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: VALIDATOR_TELEGRAM_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        value: https://the-serene-lens-nuevo.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: TRANSFER_ACCOUNT
        value: "9238000000000000"
      - key: TRANSFER_HOLDER
        value: Nombre del Titular
      - key: PAYPAL_TIMEOUT_MINUTES
        value: "5"
      - key: TRANSFER_PENDING_TIMEOUT_HOURS
        value: "2"
      - key: TRANSFER_VALIDATED_TIMEOUT_MINUTES
        value: "30"

  - type: cron
    name: monitor-pagos
    env: python
    plan: free
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/monitor_pagos.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: cron
    name: monitor-transfer
    env: python
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/monitor_transfer.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: cron
    name: check-apis
    env: python
    plan: free
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/check_apis.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: cron
    name: reporte-diario
    env: python
    plan: free
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/send_daily_report.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: cron
    name: reporte-semanal
    env: python
    plan: free
    schedule: "0 9 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/send_weekly_report.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: cron
    name: reporte-mensual
    env: python
    plan: free
    schedule: "0 9 1 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/send_monthly_report.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
