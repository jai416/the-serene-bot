services:
  - type: worker
    name: the-serene-bot
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot-telegram/bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: VALIDATOR_TELEGRAM_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        value: https://the-serene-lens-nuevo.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: TRANSFER_ACCOUNT
        value: "9238000000000000"
      - key: TRANSFER_HOLDER
        value: Nombre del Titular
      - key: PAYPAL_TIMEOUT_MINUTES
        value: "5"
      - key: TRANSFER_PENDING_TIMEOUT_HOURS
        value: "2"
      - key: TRANSFER_VALIDATED_TIMEOUT_MINUTES
        value: "30"
